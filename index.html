<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Vocab Trainer 11+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Clicker+Script&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #f0faff; font-family: 'Inter', sans-serif; }
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; justify-content: center; min-height: 65vh; }
        .resultText { font-family: 'Clicker Script', cursive; font-size: 42px; color: #0891b2; text-align: center; }
        .lookup-box { font-size: 0.85rem; background: #f0f9ff; padding: 10px; border-radius: 12px; margin-top: 8px; display: none; border: 1px dashed #bae6fd; }
        .reward-card { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-[32px] shadow-2xl p-8 border-4 border-blue-50">

        <div id="loginScreen" class="screen active text-center">
            <h1 class="text-3xl font-black text-blue-600 mb-8">Vocab Gym 11+</h1>
            <input id="loginEmail" type="email" placeholder="Email" class="w-full border-2 rounded-xl p-3 mb-3 focus:border-cyan-400 outline-none">
            <input id="loginPassword" type="password" placeholder="Password" class="w-full border-2 rounded-xl p-3 mb-6 focus:border-cyan-400 outline-none">
            <button id="loginBtn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-4 rounded-2xl transition shadow-lg">Login</button>
            <div id="loginError" class="text-red-500 text-sm mt-4"></div>
        </div>

        <div id="menu" class="screen text-center">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Hello, Vera!</h1>
            <div id="starProgress" class="mb-8 text-cyan-600 font-bold bg-cyan-50 py-2 rounded-full shadow-sm">Stars toward reward: 0/5</div>
            <button id="startPractice" class="w-full bg-cyan-500 text-white py-4 rounded-2xl mb-4 font-bold shadow-md hover:bg-cyan-600 transition">Start Daily Dictation</button>
            <button id="manageWords" class="w-full bg-slate-100 text-slate-600 py-3 rounded-2xl mb-8 font-medium hover:bg-slate-200 transition">Manage Word List</button>
            <div class="grid grid-cols-2 gap-4 text-sm text-slate-500">
                <div class="bg-white border rounded-xl p-3">Total: <span id="totalWords" class="font-bold text-slate-800">0</span></div>
                <div class="bg-white border rounded-xl p-3">Hard: <span id="hardWords" class="font-bold text-red-500">0</span></div>
            </div>
        </div>

        <div id="manage" class="screen">
            <h2 class="text-xl font-bold mb-4">Update Word List</h2>
            <textarea id="bulkWords" class="w-full border-2 rounded-xl p-3 h-32 mb-4" placeholder="Word | Sentence"></textarea>
            <button id="importWords" class="w-full bg-blue-500 text-white py-3 rounded-xl mb-6 font-bold">Import / Update</button>
            <div id="wordList" class="max-h-40 overflow-y-auto mb-6 border-t pt-4"></div>
            <button id="backMenu" class="w-full bg-gray-100 py-3 rounded-xl font-medium">Back</button>
        </div>

        <div id="preview" class="screen">
            <h2 class="text-xl font-bold mb-4 text-center">Preview Words</h2>
            <div id="previewList" class="space-y-3 mb-8"></div>
            <button id="beginDictation" class="w-full bg-cyan-500 text-white py-4 rounded-2xl font-bold shadow-lg">I'm Ready!</button>
        </div>

        <div id="dictation" class="screen text-center">
            <div id="dictSentence" class="text-lg text-slate-700 mb-6 italic leading-relaxed px-4 pt-4 border-t"></div>
            <div id="dictWord" class="text-4xl font-black text-blue-600 mb-10 tracking-tight"></div>
            <button id="nextWord" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold">Next Word →</button>
        </div>

        <div id="review" class="screen">
            <h2 class="text-xl font-bold mb-4 text-center">Check Paper</h2>
            <div id="reviewList" class="space-y-3 mb-6"></div>
            <button id="finish" disabled class="w-full bg-cyan-600 text-white py-4 rounded-2xl font-bold opacity-50">Finish</button>
        </div>

        <div id="results" class="screen text-center">
            <div id="scoreDisplay" class="text-6xl font-black text-cyan-500 mb-2">0/10</div>
            <div id="starAwarded" class="text-amber-500 font-bold mb-6 text-xl"></div>
            <div class="resultText mb-8">Amazing job, Vera!</div>
            <img id="rewardImage" class="w-full h-48 object-contain mb-8 rounded-2xl">
            <button id="backHome" class="w-full bg-cyan-500 text-white py-4 rounded-2xl font-bold">Back to Menu</button>
        </div>

        <div id="superReward" class="fixed inset-0 bg-cyan-600 bg-opacity-95 hidden items-center justify-center p-8 z-50">
            <div class="text-center text-white max-w-sm w-full reward-card">
                <div class="text-7xl mb-6">🎁</div>
                <h2 class="text-3xl font-black mb-2">SUPER REWARD!</h2>
                <div id="prizeName" class="text-2xl font-bold bg-white text-cyan-600 p-8 rounded-3xl shadow-2xl mb-10 mt-4 border-4 border-amber
