<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{background:#f0faff}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;justify-content:center;min-height:65vh}
.scoreBig{font-size:48px;font-weight:900;color:#06b6d4}
.resultText{
font-family:'Clicker Script',cursive;
font-size:48px;
line-height:1.2;
color:#0891b2;
text-align:center;
text-shadow:2px 2px 0 #ffffff,4px 4px 6px rgba(0,0,0,0.15)
}
.word-panel{max-height:0;overflow:hidden;transition:max-height 0.32s ease}
.word-card.open .word-panel{max-height:250px}
.chevron{display:inline-block;transition:transform 0.32s ease;line-height:1}
.word-card.open .chevron{transform:rotate(90deg)}
</style>

</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-[24px] shadow-xl p-6">

<div id="loginScreen" class="screen active text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocab Trainer Login</h1>
<input id="loginEmail" type="email" placeholder="Email" class="w-full border rounded-lg p-2 mb-3">
<input id="loginPassword" type="password" placeholder="Password" class="w-full border rounded-lg p-2 mb-3">
<button id="loginBtn" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Login</button>
<div id="loginError" class="text-red-500 text-sm"></div>
</div>

<div id="menu" class="screen text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocabulary Trainer</h1>
<button id="startPractice" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Start Practice</button>
<button id="manageWords" class="w-full bg-blue-500 text-white py-3 rounded-xl mb-4">Manage Word List</button>
<div class="bg-yellow-50 rounded-xl px-4 py-3 mt-2 mb-2">
<div id="starsDisplay" class="text-yellow-600 font-semibold text-sm">⭐ Stars toward reward: 0 / 5</div>
</div>
<div class="text-center text-sm text-gray-500 mt-2">
<div>Total Words: <span id="totalWords">0</span></div>
<div>Hard Words: <span id="hardWords">0</span></div>
</div>
<button id="testReward" class="mt-6 text-xs text-gray-300">test reward</button>
</div>

<div id="manage" class="screen">
<h2 class="text-lg font-bold mb-3 text-center">Import Words</h2>
<textarea id="bulkWords" placeholder="word&#10;word | sentence" class="w-full border rounded-lg p-2 h-24 mb-3"></textarea>
<button id="importWords" class="w-full bg-cyan-500 text-white py-2 rounded-lg mb-1">Import</button>
<div id="importResult" class="text-sm text-gray-400 mb-3 text-center"></div>
<input id="wordSearch" type="text" placeholder="Search words…" class="w-full border rounded-lg p-2 mb-2 text-sm">
<div id="wordList" class="max-h-48 overflow-y-auto text-sm mb-4"></div>
<button id="backMenu" class="w-full bg-gray-200 py-2 rounded-lg">Back</button>
</div>

<div id="preview" class="screen">
<h2 class="text-lg font-bold mb-4 text-center">Preview Words</h2>
<div id="previewList" class="mb-4"></div>
<button id="beginDictation" class="w-full bg-cyan-500 text-white py-3 rounded-xl">Start Dictation</button>
</div>

<div id="dictation" class="screen text-center">
<div id="dictWord" class="text-2xl font-bold text-blue-600 mb-6 leading-snug"></div>
<button id="nextWord" class="w-full bg-cyan-500 text-white py-3 rounded-xl">Next</button>
</div>

<div id="review" class="screen">
<div id="reviewList" class="space-y-2 mb-4"></div>
<button id="finish" disabled class="w-full bg-blue-500 text-white py-3 rounded-xl opacity-50">Save & Finish</button>
</div>

<div id="results" class="screen text-center">
<div id="score" class="scoreBig mb-2"></div>
<div id="earnedStar" class="hidden text-yellow-500 font-bold text-lg mb-2">⭐ You've earned a star!</div>
<div class="resultText mb-4">
Well done, Vera!<br>See you tomorrow!
</div>
<img id="rewardImage" class="w-full h-64 object-contain mb-4">
<button id="backHome" class="w-full bg-cyan-500 text-white py-3 rounded-xl">Back to Menu</button>
</div>

</div>

<div id="superRewardOverlay" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.78)" class="flex items-center justify-center p-4">
<div class="bg-white rounded-[24px] shadow-2xl p-8 w-full max-w-md text-center">
<div class="text-7xl mb-3">🎁</div>
<div class="text-cyan-600 font-black text-2xl mb-1">VERA, YOU DID IT!</div>
<div class="text-gray-400 font-bold text-xs tracking-widest uppercase mb-6">Super Reward</div>
<div id="rewardName" class="text-2xl font-black text-gray-800 mb-2 leading-snug"></div>
<div id="rewardDesc" class="text-gray-500 text-sm mb-8 leading-relaxed"></div>
<button id="rewardGotIt" class="w-full bg-cyan-500 text-white py-4 rounded-xl text-xl font-bold">YEAY! 🎉</button>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

let words=[],history=[],practice=[],marks={},current=0
let confettiInterval=null,openIndex=null,stars=0
const dictCache={}
const rewardsPool=[
{name:"High-Flyer",desc:"15 minutes of pure fun on the swing in the street"},
{name:"Suttles Treasure Hunt",desc:"Any small item/stationery up to £3"},
{name:"Barnaby & Boo",desc:"One single scoop in a cone or tub (one scoop!)"},
{name:"£3 Pocket Money Boost",desc:"Extra money for the piggy bank"},
{name:"15 min Digital Bonus",desc:"Extra screen time"},
{name:"VIP Toothbrushing",desc:"Mum brushes your teeth for you while you relax!"},
{name:"Extra Chapter",desc:"Extra 15 min of bedtime reading"},
{name:"Freedom Pass",desc:"Skip one pet cage cleaning session this week"},
{name:"Park Dash",desc:"15 minutes of extra play time at the park"},
{name:"Board Game Night",desc:"You choose the game, and we all play together"},
{name:"Chief of the Kitchen",desc:"You choose the dinner menu for the whole family"}
]

const firebaseConfig={
apiKey:"AIzaSyDJRe201hVZmoYlp7DZLLmXv_adnHRXmZs",
authDomain:"vocabtrainer-969fd.firebaseapp.com",
databaseURL:"https://vocabtrainer-969fd-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"vocabtrainer-969fd",
storageBucket:"vocabtrainer-969fd.appspot.com",
messagingSenderId:"991443793775",
appId:"1:991443793775:web:0d044609e2b3eb4e611a9a"
}

firebase.initializeApp(firebaseConfig)
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)

firebase.auth().onAuthStateChanged(user=>{
if(user){ loadData(); show("menu") }
})

document.getElementById("loginBtn").onclick=()=>{
firebase.auth()
.signInWithEmailAndPassword(
document.getElementById("loginEmail").value,
document.getElementById("loginPassword").value
)
.catch(e=>document.getElementById("loginError").textContent=e.message)
}

function loadData(){
firebase.database().ref("words").once("value").then(s=>{
words=s.val()||[]
updateStats(); renderWordList()
})
firebase.database().ref("history").once("value").then(s=>{
history=s.val()||[]
})
firebase.database().ref("stars").once("value").then(s=>{
stars=s.val()||0
updateStars()
})
}

function save(){
firebase.database().ref("words").set(words)
firebase.database().ref("history").set(history)
}

function saveStars(){
firebase.database().ref("stars").set(stars)
}

function updateStars(){
document.getElementById("starsDisplay").textContent=`⭐ Stars toward reward: ${stars} / 5`
}

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function today(){ return Math.floor(Date.now()/86400000) }

function updateStats(){
document.getElementById("totalWords").textContent=words.length
document.getElementById("hardWords").textContent=words.filter(w=>w.mistakes>0).length
}

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
let t=a[i];a[i]=a[j];a[j]=t
}
return a
}

function getPracticeWords(){
let due=words.filter(w=>!w.due||w.due<=today())
let pool=[]
due.forEach(w=>{
pool.push(w)
if(w.mistakes>0) pool.push(w)
if(w.mistakes>2) pool.push(w)
})
if(pool.length<10) pool=pool.concat(words)
pool=shuffle(pool)
let result=[],used=new Set()
for(let w of pool){
if(!used.has(w.text)){ result.push(w); used.add(w.text) }
if(result.length>=10) break
}
return result
}

document.getElementById("startPractice").onclick=()=>{
practice=getPracticeWords()
if(practice.length===0) return
openIndex=null
let list=document.getElementById("previewList")
list.innerHTML=""
practice.forEach((w,i)=>{
let card=document.createElement("div")
card.className="word-card mb-3 rounded-xl bg-gray-50 overflow-hidden"
card.innerHTML=`
<div class="word-row flex items-center justify-between px-4 cursor-pointer" style="min-height:60px">
<span class="text-xl font-medium text-gray-800">${w.text}</span>
<span class="chevron text-gray-400 text-xl">›</span>
</div>
<div class="word-panel">
<div class="px-4 pt-2 pb-4 border-t border-gray-100" id="panel-${i}">
<span class="text-gray-400 text-sm">Tap to look up…</span>
</div>
</div>`
card.querySelector(".word-row").onclick=()=>toggleWord(i,card,w.text)
list.appendChild(card)
})
show("preview")
}

function dictDisplay(w){ return w.sentence||w.text }

document.getElementById("beginDictation").onclick=()=>{
current=0
document.getElementById("dictWord").textContent=dictDisplay(practice[current])
show("dictation")
}

document.getElementById("nextWord").onclick=()=>{
current++
if(current<practice.length){
document.getElementById("dictWord").textContent=dictDisplay(practice[current])
}else buildReview()
}

function buildReview(){
marks={}
let box=document.getElementById("reviewList")
box.innerHTML=""
practice.forEach((w,i)=>{
let row=document.createElement("div")
row.className="flex justify-between items-center"
row.innerHTML=`
<span>${w.text}</span>
<div class="flex border rounded-lg overflow-hidden">
<button class="good px-3 py-1 text-green-600">✓</button>
<button class="bad px-3 py-1 text-red-600">✕</button>
</div>`
let good=row.querySelector(".good")
let bad=row.querySelector(".bad")

// ✅ ВОССТАНОВЛЕНА ВИЗУАЛЬНАЯ ЛОГИКА

good.onclick=()=>{
marks[i]="good"
good.classList.add("bg-green-500","text-white")
bad.classList.remove("bg-red-500","text-white")
checkFinish()
}

bad.onclick=()=>{
marks[i]="bad"
bad.classList.add("bg-red-500","text-white")
good.classList.remove("bg-green-500","text-white")
checkFinish()
}

box.appendChild(row)
})
show("review")
}

function checkFinish(){
if(Object.keys(marks).length===practice.length){
let btn=document.getElementById("finish")
btn.disabled=false
btn.classList.remove("opacity-50")
}
}

document.getElementById("finish").onclick=()=>{

let score=0,superReward=false

practice.forEach((w,i)=>{
if(!w.interval)w.interval=1
if(!w.ease)w.ease=2.5
if(!w.mistakes)w.mistakes=0

if(marks[i]=="good"){
score++
w.interval=Math.round(w.interval*w.ease)
w.ease+=0.15
}else{
w.interval=1
w.ease=Math.max(1.3,w.ease-0.25)
w.mistakes++
}
w.due=today()+w.interval
})

history.push({date:today(),score:score})
if(history.length>30)history.shift()

if(score>=8){
stars++
if(stars>=5){ superReward=true; stars=0 }
}

save()
saveStars()
updateStats()
updateStars()

document.getElementById("score").textContent=`${score}/10`

const earnedEl=document.getElementById("earnedStar")
earnedEl.classList.toggle("hidden",!(score>=8&&!superReward))

let imgs=["1.png","2.png","3.png","4.png","5.png"]
document.getElementById("rewardImage").src=imgs[Math.floor(Math.random()*imgs.length)]

show("results")

if(confettiInterval) clearInterval(confettiInterval)

if(score>=8){
const iv=superReward?600:1200
const pc=superReward?200:120
const sp=superReward?140:100
confettiInterval=setInterval(()=>{
confetti({particleCount:pc,spread:sp,origin:{y:0.6}})
},iv)
}

if(superReward) showSuperReward()

}

document.getElementById("backHome").onclick=()=>{
if(confettiInterval){ clearInterval(confettiInterval); confettiInterval=null }
document.getElementById("earnedStar").classList.add("hidden")
show("menu")
}

document.getElementById("manageWords").onclick=()=>{renderWordList();show("manage")}

function renderWordList(){
const query=document.getElementById("wordSearch").value.toLowerCase().trim()
const filtered=query?words.filter(w=>w.text.toLowerCase().includes(query)):words
let list=document.getElementById("wordList")
list.innerHTML=""
filtered.forEach(w=>{
const origIdx=words.indexOf(w)
let row=document.createElement("div")
row.className="flex justify-between mb-1"
row.innerHTML=`<span>${w.text}</span><button class="text-red-500">✕</button>`
row.querySelector("button").onclick=()=>{
words.splice(origIdx,1)
save();renderWordList();updateStats()
}
list.appendChild(row)
})
}

document.getElementById("importWords").onclick=()=>{
let text=document.getElementById("bulkWords").value
let added=0,updated=0
text.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
const parts=line.split("|")
const wordText=parts[0].trim()
const sentence=parts[1]?parts[1].trim():null
if(!wordText) return
const existing=words.find(w=>w.text.toLowerCase()===wordText.toLowerCase())
if(existing){
if(sentence) existing.sentence=sentence
updated++
}else{
const entry={text:wordText,interval:1,ease:2.5,due:today(),mistakes:0}
if(sentence) entry.sentence=sentence
words.push(entry)
added++
}
})
document.getElementById("bulkWords").value=""
document.getElementById("importResult").textContent=`Added: ${added}, updated: ${updated}`
save();renderWordList();updateStats()
}

document.getElementById("backMenu").onclick=()=>show("menu")
document.getElementById("wordSearch").oninput=()=>renderWordList()

function showSuperReward(){
const prize=rewardsPool[Math.floor(Math.random()*rewardsPool.length)]
document.getElementById("rewardName").textContent=prize.name
document.getElementById("rewardDesc").textContent=prize.desc
document.getElementById("superRewardOverlay").style.display="flex"
}

document.getElementById("testReward").onclick=()=>showSuperReward()

document.getElementById("rewardGotIt").onclick=()=>{
document.getElementById("superRewardOverlay").style.display="none"
if(confettiInterval){ clearInterval(confettiInterval); confettiInterval=null }
document.getElementById("earnedStar").classList.add("hidden")
show("menu")
}

function toggleWord(i,card,wordText){
if(openIndex!==null&&openIndex!==i){
document.querySelectorAll(".word-card")[openIndex].classList.remove("open")
}
if(openIndex===i){
card.classList.remove("open")
openIndex=null
return
}
card.classList.add("open")
openIndex=i
const panel=document.getElementById(`panel-${i}`)
if(panel.dataset.loaded) return
panel.dataset.loaded="1"
panel.innerHTML=`<span class="text-gray-400 text-sm">Loading…</span>`
fetchWordInfo(wordText)
.then(data=>{panel.innerHTML=buildAccordionContent(data,wordText)})
.catch(e=>{
console.error("Dictionary fetch failed:",e)
panel.innerHTML=`<span class="text-gray-400 text-sm">No entry found.</span>`
})
}

function buildAccordionContent(data,wordText){
const meaning=data[0].meanings[0]
const def=meaning?meaning.definitions[0]:null
if(!def) return`<span class="text-gray-400 text-sm">No definitions available.</span>`
const syns=[...new Set([...(meaning.synonyms||[]),...(def.synonyms||[])])].slice(0,3)
const camUrl=`https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(wordText.trim())}`
let html=`<p class="text-gray-700 text-sm mb-2">${def.definition}</p>`
if(syns.length) html+=`<p class="text-cyan-600 text-sm mb-3">${syns.join(" · ")}</p>`
html+=`<a href="${camUrl}" target="_blank" rel="noopener" class="text-sm text-blue-500 font-medium">Full Definition →</a>`
return html
}

async function fetchWordInfo(word){
const key=word.trim()
if(dictCache[key]) return dictCache[key]
const res=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`)
if(!res.ok) throw new Error("not found")
const data=await res.json()
if(!Array.isArray(data)||!data[0]||!data[0].meanings) throw new Error("unexpected response")
dictCache[key]=data
return data
}

})
</script>

</body>
</html>
