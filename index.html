```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{background:#f0faff}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;justify-content:center;min-height:65vh}

.scoreBig{font-size:48px;font-weight:900;color:#06b6d4}

.resultText{
font-family:'Clicker Script',cursive;
font-size:56px;
line-height:1.1;
color:#0891b2;
text-align:center;
text-shadow:2px 2px 0 #fff,4px 4px 8px rgba(0,0,0,.12)
}

.starRow{
font-size:42px;
letter-spacing:10px;
margin-bottom:14px;
}

</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-[24px] shadow-xl p-6">

<!-- LOGIN -->
<div id="loginScreen" class="screen active text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocab Trainer Login</h1>
<input id="loginEmail" type="email" placeholder="Email" class="w-full border rounded-lg p-2 mb-3">
<input id="loginPassword" type="password" placeholder="Password" class="w-full border rounded-lg p-2 mb-3">
<button id="loginBtn" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Login</button>
<div id="loginError" class="text-red-500 text-sm"></div>
</div>

<!-- MENU -->
<div id="menu" class="screen text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocabulary Trainer</h1>

<button id="startPractice" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Start Practice</button>
<button id="manageWords" class="w-full bg-blue-500 text-white py-3 rounded-xl mb-4">Manage Word List</button>

<div class="text-sm text-gray-500 mt-6">
<div>Total Words: <span id="totalWords">0</span></div>
<div>Hard Words: <span id="hardWords">0</span></div>
<div class="mt-2 font-semibold text-yellow-600">
Stars toward reward: <span id="starsMenu">0</span>/5
</div>
</div>
</div>

<!-- RESULTS -->
<div id="results" class="screen text-center">

<div id="score" class="scoreBig mb-4"></div>

<div class="resultText mb-2">
Well done, Vera!
</div>

<div id="starsBar" class="starRow"></div>

<img id="rewardImage" class="w-full h-64 object-contain mb-4">

<button id="backHome" class="w-full bg-cyan-500 text-white py-3 rounded-xl">
Back to Menu
</button>

</div>

<!-- REWARD -->
<div id="rewardScreen" class="screen text-center">
<div class="resultText mb-4">You got a reward!</div>
<div id="rewardText" class="text-lg text-gray-700 mb-6"></div>
<button id="rewardBack" class="w-full bg-cyan-500 text-white py-3 rounded-xl">
Back to Menu
</button>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

let words=[],history=[],practice=[],marks={},current=0
let stars=0
let confettiInterval=null

const rewards=[
"Suttles Treasure Hunt (≤ £3)",
"Barnaby & Boo Treat (1 scoop ≤ £3)",
"£3 Pocket Money Boost",
"15 min Digital Bonus",
"VIP Toothbrushing",
"Extra Chapter (15 min)",
"High-Flyer (15 min swings)",
"Freedom Pass (skip pet cages once)",
"Park Dash (15 min)",
"Board Game Night",
"Choose the Dinner Menu"
]

const firebaseConfig={
apiKey:"AIzaSyDJRe201hVZmoYlp7DZLLmXv_adnHRXmZs",
authDomain:"vocabtrainer-969fd.firebaseapp.com",
databaseURL:"https://vocabtrainer-969fd-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"vocabtrainer-969fd",
storageBucket:"vocabtrainer-969fd.appspot.com",
messagingSenderId:"991443793775",
appId:"1:991443793775:web:0d044609e2b3eb4e611a9a"
}

firebase.initializeApp(firebaseConfig)
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)

firebase.auth().onAuthStateChanged(user=>{
if(user){
loadData()
show("menu")
}
})

document.getElementById("loginBtn").onclick=()=>{
firebase.auth()
.signInWithEmailAndPassword(
loginEmail.value,
loginPassword.value
)
.catch(e=>loginError.textContent=e.message)
}

function loadData(){
firebase.database().ref("words").once("value").then(s=>{
words=s.val()||[]
updateStats()
})

firebase.database().ref("history").once("value").then(s=>{
history=s.val()||[]
})

firebase.database().ref("stars").once("value").then(s=>{
stars=s.val()||0
updateStars()
})
}

function save(){
firebase.database().ref("words").set(words)
firebase.database().ref("history").set(history)
firebase.database().ref("stars").set(stars)
}

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function today(){ return Math.floor(Date.now()/86400000) }

function updateStats(){
totalWords.textContent=words.length
hardWords.textContent=words.filter(w=>w.mistakes>0).length
}

function updateStars(){
starsMenu.textContent=stars
let html=""
for(let i=1;i<=5;i++){
html+= i<=stars ? "⭐" : "☆"
}
starsBar.innerHTML=html
}

document.getElementById("startPractice").onclick=()=>{
practice=words.slice(0,10)
if(practice.length===0) return
show("results") // временно чтобы можно было тестить
finish()
}

function finish(){

let score=8 // тестовый фикс, чтобы всегда срабатывало

history.push({date:today(),score:score})

if(score>=8){
stars++
if(stars>=5){
stars=0
let r=rewards[Math.floor(Math.random()*rewards.length)]
rewardText.textContent=r
show("rewardScreen")
save()
return
}
}

save()
updateStars()

scoreText=`${score}/10`
document.getElementById("score").textContent=scoreText

let imgs=["1.png","2.png","3.png","4.png","5.png"]
rewardImage.src=imgs[Math.floor(Math.random()*imgs.length)]

show("results")

if(confettiInterval) clearInterval(confettiInterval)

confettiInterval=setInterval(()=>{
confetti({particleCount:120,spread:100,origin:{y:0.6}})
},1200)

}

document.getElementById("backHome").onclick=()=>{
clearInterval(confettiInterval)
show("menu")
}

document.getElementById("rewardBack").onclick=()=>{
show("menu")
}

})
</script>

</body>
</html>
