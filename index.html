<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap" rel="stylesheet">

<style>
body{background:#f0faff}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;justify-content:center;min-height:65vh}
.scoreBig{font-size:48px;font-weight:900;color:#06b6d4}
.resultText{
font-family:'Clicker Script',cursive;
font-size:56px;
line-height:1.1;
color:#0891b2;
text-align:center;
text-shadow:2px 2px 0 #ffffff,4px 4px 8px rgba(0,0,0,0.12)
}
.starRow{
font-size:44px;
letter-spacing:8px;
text-align:center;
margin-top:6px;
margin-bottom:14px;
filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));
}
.rewardTitle{
font-family:'Clicker Script',cursive;
font-size:52px;
line-height:1.1;
color:#0891b2;
text-align:center;
text-shadow:2px 2px 0 #ffffff,4px 4px 8px rgba(0,0,0,0.12)
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-[24px] shadow-xl p-6">

<div id="loginScreen" class="screen active text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocab Trainer Login</h1>
<input id="loginEmail" type="email" placeholder="Email" class="w-full border rounded-lg p-2 mb-3">
<input id="loginPassword" type="password" placeholder="Password" class="w-full border rounded-lg p-2 mb-3">
<button id="loginBtn" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Login</button>
<div id="loginError" class="text-red-500 text-sm"></div>
</div>

<div id="menu" class="screen text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocabulary Trainer</h1>

<button id="startPractice" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Start Practice</button>

<button id="manageWords" class="w-full bg-blue-500 text-white py-3 rounded-xl mb-4">Manage Word List</button>

<div class="text-center text-sm text-gray-500 mt-6">
<div>Total Words: <span id="totalWords">0</span></div>
<div>Hard Words: <span id="hardWords">0</span></div>
<div class="mt-2 font-semibold text-yellow-600">Stars toward reward: <span id="starsMenu">0</span>/5</div>
</div>
</div>

<div id="results" class="screen text-center">
<div id="score" class="scoreBig mb-4"></div>

<div class="resultText mb-2">
Well done, Vera!
</div>

<div id="starBar" class="starRow"></div>

<img id="rewardImage" class="w-full h-64 object-contain mb-4">

<button id="backHome" class="w-full bg-cyan-500 text-white py-3 rounded-xl">
Back to Menu
</button>
</div>

<div id="rewardScreen" class="screen text-center">
<div class="rewardTitle mb-4">Amazing Work, Vera!</div>
<div class="text-2xl mb-3">🏆</div>
<div class="text-lg font-bold text-cyan-700 mb-4">You've earned:</div>
<div id="rewardText" class="text-base text-gray-700 mb-6 leading-relaxed"></div>
<button id="rewardBack" class="w-full bg-cyan-500 text-white py-3 rounded-xl">Back to Menu</button>
</div>

</div>

<script>
let stars=0

function renderStars(){
let html=""
for(let i=1;i<=5;i++){
html+=i<=stars?"⭐":"☆"
}
document.getElementById("starBar").innerHTML=html
document.getElementById("starsMenu").textContent=stars
}

renderStars()
</script>

</body>
</html>
