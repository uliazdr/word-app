```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{background:#f0faff}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;justify-content:center;min-height:65vh}
.scoreBig{font-size:48px;font-weight:900;color:#06b6d4}
.resultText{
font-family:'Clicker Script',cursive;
font-size:48px;
line-height:1.2;
color:#0891b2;
text-align:center;
text-shadow:2px 2px 0 #ffffff,4px 4px 6px rgba(0,0,0,0.15)
}
.starRow{font-size:30px;letter-spacing:6px}
.rewardTitle{
font-family:'Clicker Script',cursive;
font-size:46px;
color:#0891b2;
line-height:1.1;
text-shadow:2px 2px 0 #fff,4px 4px 6px rgba(0,0,0,.12)
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-[24px] shadow-xl p-6">

<!-- LOGIN -->
<div id="loginScreen" class="screen active text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocab Trainer Login</h1>
<input id="loginEmail" type="email" placeholder="Email" class="w-full border rounded-lg p-2 mb-3">
<input id="loginPassword" type="password" placeholder="Password" class="w-full border rounded-lg p-2 mb-3">
<button id="loginBtn" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">Login</button>
<div id="loginError" class="text-red-500 text-sm"></div>
</div>

<!-- MENU -->
<div id="menu" class="screen text-center">
<h1 class="text-2xl font-bold text-blue-600 mb-6">Vocabulary Trainer</h1>

<button id="startPractice" class="w-full bg-cyan-500 text-white py-3 rounded-xl mb-4">
Start Practice
</button>

<button id="manageWords" class="w-full bg-blue-500 text-white py-3 rounded-xl mb-4">
Manage Word List
</button>

<div class="text-center text-sm text-gray-500 mt-6">
<div>Total Words: <span id="totalWords">0</span></div>
<div>Hard Words: <span id="hardWords">0</span></div>
<div class="mt-2 font-semibold text-yellow-600">Stars toward reward: <span id="starsMenu">0</span>/5</div>
</div>
</div>

<!-- MANAGE -->
<div id="manage" class="screen">
<h2 class="text-lg font-bold mb-3 text-center">Import Words</h2>
<textarea id="bulkWords" class="w-full border rounded-lg p-2 h-24 mb-3"
placeholder="word | sentence"></textarea>
<button id="importWords" class="w-full bg-cyan-500 text-white py-2 rounded-lg mb-4">Import</button>
<div id="wordList" class="max-h-48 overflow-y-auto text-sm mb-4"></div>
<button id="backMenu" class="w-full bg-gray-200 py-2 rounded-lg">Back</button>
</div>

<!-- PREVIEW -->
<div id="preview" class="screen text-center">
<h2 class="text-lg font-bold mb-4">Preview Words</h2>
<div id="previewList" class="mb-4"></div>
<button id="beginDictation" class="w-full bg-cyan-500 text-white py-3 rounded-xl">Start Dictation</button>
</div>

<!-- DICTATION -->
<div id="dictation" class="screen text-center">
<div id="dictWord" class="text-2xl font-bold text-blue-600 mb-6 leading-relaxed"></div>
<button id="nextWord" class="w-full bg-cyan-500 text-white py-3 rounded-xl">Next</button>
</div>

<!-- REVIEW -->
<div id="review" class="screen">
<div id="reviewList" class="space-y-2 mb-4"></div>
<button id="finish" disabled class="w-full bg-blue-500 text-white py-3 rounded-xl opacity-50">Save & Finish</button>
</div>

<!-- RESULTS -->
<div id="results" class="screen text-center">
<div id="score" class="scoreBig mb-4"></div>

<div class="resultText mb-2">
Well done, Vera!<br>See you tomorrow!
</div>

<div id="starBar" class="starRow mb-4"></div>

<img id="rewardImage" class="w-full h-64 object-contain mb-4">

<button id="backHome" class="w-full bg-cyan-500 text-white py-3 rounded-xl">
Back to Menu
</button>
</div>

<!-- REWARD -->
<div id="rewardScreen" class="screen text-center">
<div class="rewardTitle mb-4">
Amazing Work, Vera!
</div>

<div class="text-2xl mb-3">🏆</div>

<div class="text-lg font-bold text-cyan-700 mb-4">
You've earned:
</div>

<div id="rewardText" class="text-base text-gray-700 mb-6 leading-relaxed"></div>

<button id="rewardBack" class="w-full bg-cyan-500 text-white py-3 rounded-xl">
Back to Menu
</button>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

let words=[],history=[],practice=[],marks={},current=0
let stars=0
let confettiInterval=null

const rewards=[
"Suttles Treasure Hunt – choose 1 stationery item up to £3",
"Barnaby & Boo Treat – 1 scoop ice cream up to £3",
"£3 Pocket Money Boost",
"15 min Digital Bonus",
"VIP Toothbrushing – Mum brushes for you",
"Extra Chapter – bedtime reading 15 min",
"High-Flyer – 15 min swings outside",
"Freedom Pass – skip 1 pet cage clean",
"Park Dash – extra 15 min park play",
"Board Game Night – you choose the game",
"Choose the Dinner Menu"
]

const firebaseConfig={
apiKey:"AIzaSyDJRe201hVZmoYlp7DZLLmXv_adnHRXmZs",
authDomain:"vocabtrainer-969fd.firebaseapp.com",
databaseURL:"https://vocabtrainer-969fd-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"vocabtrainer-969fd",
storageBucket:"vocabtrainer-969fd.appspot.com",
messagingSenderId:"991443793775",
appId:"1:991443793775:web:0d044609e2b3eb4e611a9a"
}

firebase.initializeApp(firebaseConfig)
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)

firebase.auth().onAuthStateChanged(user=>{
if(user){loadData();show("menu")}
})

document.getElementById("loginBtn").onclick=()=>{
firebase.auth().signInWithEmailAndPassword(
loginEmail.value,loginPassword.value
).catch(e=>loginError.textContent=e.message)
}

function loadData(){
firebase.database().ref("words").once("value").then(s=>{
words=s.val()||[]
updateStats()
renderWordList()
})
firebase.database().ref("history").once("value").then(s=>{
history=s.val()||[]
})
firebase.database().ref("stars").once("value").then(s=>{
stars=s.val()||0
renderStars()
})
}

function save(){
firebase.database().ref("words").set(words)
firebase.database().ref("history").set(history)
firebase.database().ref("stars").set(stars)
}

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function today(){return Math.floor(Date.now()/86400000)}

function updateStats(){
totalWords.textContent=words.length
hardWords.textContent=words.filter(w=>w.mistakes>0).length
starsMenu.textContent=stars
}

function renderStars(){
starsMenu.textContent=stars
let html=""
for(let i=1;i<=5;i++){
html+=i<=stars?"⭐":"☆"
}
starBar.textContent=html
}

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
let t=a[i];a[i]=a[j];a[j]=t
}
return a
}

function getPracticeWords(){
let due=words.filter(w=>!w.due||w.due<=today())
let pool=[]
due.forEach(w=>{
pool.push(w)
if(w.mistakes>0)pool.push(w)
if(w.mistakes>2)pool.push(w)
})
if(pool.length<10)pool=pool.concat(words)
pool=shuffle(pool)

let result=[],used=new Set()
for(let w of pool){
if(!used.has(w.text)){
result.push(w)
used.add(w.text)
}
if(result.length>=10)break
}
return result
}

startPractice.onclick=()=>{
practice=getPracticeWords()
if(practice.length===0)return
previewList.innerHTML=""
practice.forEach(w=>previewList.innerHTML+=`<div>${w.text}</div>`)
show("preview")
}

beginDictation.onclick=()=>{
current=0
dictWord.textContent=practice[current].sentence||practice[current].text
show("dictation")
}

nextWord.onclick=()=>{
current++
if(current<practice.length){
dictWord.textContent=practice[current].sentence||practice[current].text
}else buildReview()
}

function buildReview(){
marks={}
reviewList.innerHTML=""

practice.forEach((w,i)=>{
let row=document.createElement("div")
row.className="flex justify-between items-center"

row.innerHTML=`
<span>${w.text}</span>
<div class="flex border rounded-lg overflow-hidden">
<button class="good px-3 py-1 text-green-600">✓</button>
<button class="bad px-3 py-1 text-red-600">✕</button>
</div>`

let good=row.querySelector(".good")
let bad=row.querySelector(".bad")

good.onclick=()=>{
marks[i]="good"
good.classList.add("bg-green-500","text-white")
bad.classList.remove("bg-red-500","text-white")
checkFinish()
}

bad.onclick=()=>{
marks[i]="bad"
bad.classList.add("bg-red-500","text-white")
good.classList.remove("bg-green-500","text-white")
checkFinish()
}

reviewList.appendChild(row)
})

show("review")
}

function checkFinish(){
if(Object.keys(marks).length===practice.length){
finish.disabled=false
finish.classList.remove("opacity-50")
}
}

finish.onclick=()=>{

let score=0

practice.forEach((w,i)=>{
if(!w.interval)w.interval=1
if(!w.ease)w.ease=2.5
if(!w.mistakes)w.mistakes=0

if(marks[i]=="good"){
score++
w.interval=Math.round(w.interval*w.ease)
w.ease+=0.15
}else{
w.interval=1
w.ease=Math.max(1.3,w.ease-0.25)
w.mistakes++
}

w.due=today()+w.interval
})

history.push({date:today(),score:score})
if(history.length>30)history.shift()

if(score>=8)stars++

save()
updateStats()
renderStars()

score.innerText=`${score}/10`

let imgs=["1.png","2.png","3.png","4.png","5.png"]
rewardImage.src=imgs[Math.floor(Math.random()*imgs.length)]

show("results")

if(confettiInterval)clearInterval(confettiInterval)

if(score>=8){
confettiInterval=setInterval(()=>{
confetti({particleCount:120,spread:100,origin:{y:0.6}})
},1200)
}

if(stars>=5){
setTimeout(()=>{
stars=0
save()
renderStars()
rewardText.textContent=rewards[Math.floor(Math.random()*rewards.length)]
show("rewardScreen")
},1500)
}

}

backHome.onclick=()=>{
if(confettiInterval){
clearInterval(confettiInterval)
confettiInterval=null
}
show("menu")
}

rewardBack.onclick=()=>{
if(confettiInterval){
clearInterval(confettiInterval)
confettiInterval=null
}
show("menu")
}

manageWords.onclick=()=>{
renderWordList()
show("manage")
}

function renderWordList(){
wordList.innerHTML=""

words.forEach((w,i)=>{
let row=document.createElement("div")
row.className="flex justify-between mb-1"

row.innerHTML=`<span>${w.text}</span><button class="text-red-500">✕</button>`

row.querySelector("button").onclick=()=>{
words.splice(i,1)
save()
renderWordList()
updateStats()
}

wordList.appendChild(row)
})
}

importWords.onclick=()=>{
let text=bulkWords.value.trim()
if(!text)return

text.split("\n").forEach(line=>{
line=line.trim()
if(!line)return

let parts=line.split("|")
let word=parts[0].trim()
let sentence=(parts[1]||"").trim()

let existing=words.find(x=>x.text.toLowerCase()==word.toLowerCase())

if(existing){
existing.sentence=sentence
}else{
words.push({
text:word,
sentence:sentence,
interval:1,
ease:2.5,
due:today(),
mistakes:0
})
}
})

bulkWords.value=""
save()
renderWordList()
updateStats()
}

backMenu.onclick=()=>show("menu")

})
</script>

</body>
</html>
```
