  <line x1="447" y1="335" x2="280" y2="335" stroke="#7a4010" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="447" y1="358" x2="280" y2="342" stroke="#7a4010" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
